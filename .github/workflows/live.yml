name: Facebook Live Stream to YouTube (Vertical & Loop)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install --upgrade yt-dlp

      - name: Fetch Video Link & Push Stream to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          FB_URL: "https://www.facebook.com/share/v/1FCq9pEybS/"
        run: |
          echo "Extracting direct video URL from Facebook link..."
          DIRECT_STREAM_URL=$(yt-dlp -f "best" -g "$FB_URL")

          if [ -z "$DIRECT_STREAM_URL" ]; then
            echo "Error: Facebook video URL extract nahi hua!"
            exit 1
          fi

          echo "Direct Link retrieved successfully. Starting Loop & Vertical Stream to YouTube..."

          # -stream_loop -1 se video infinite loop par chalegi
          # -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" se video Vertical (9:16) format mein ho jayegi
          ffmpeg -re -stream_loop -1 -i "$DIRECT_STREAM_URL" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1" \
            -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
