name: YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install -U yt-dlp

      - name: Get YouTube video stream
        run: |
          yt-dlp \
            -f "best[ext=mp4]/best" \
            --get-url \
            "https://www.youtube.com/watch?v=bNH_4jhFAOE" > video_url.txt

      - name: Start YouTube Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          VIDEO_URL=$(cat video_url.txt)

          ffmpeg -re -stream_loop -1 \
            -i "$VIDEO_URL" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 6800k \
            -maxrate 6800k \
            -bufsize 13600k \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
