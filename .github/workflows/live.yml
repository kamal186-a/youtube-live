name: YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget

      - name: Download video
        run: |
          wget --no-check-certificate \
            "https://drive.usercontent.google.com/download?id=136yBfF3ZD9TVP91jrj4khXt6J7G2cYJD&export=download&confirm=t" \
            -O video.mp4

      - name: Start YouTube Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg -re -stream_loop -1 \
            -i video.mp4 \
            -c:v libx264 \
            -preset veryfast \
            -b:v 6800k \
            -maxrate 6800k \
            -bufsize 13600k \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
