      # ==============================
      # 5. Start YouTube Vertical Live
      # ==============================
      - name: Start YouTube Vertical Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |
          ffmpeg \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -loop 1 \
            -i subscribe.png \
            -filter_complex "
              [0:v]scale=1080:1920:force_original_aspect_ratio=decrease,
              pad=1080:1920:(ow-iw)/2:(oh-ih)/2[video];
              [1:v]scale=650:-1[subscribe];
              [video][subscribe]overlay=(W-w)/2:80[withsub];
              [withsub]drawtext=text='اللہ پاک کے لیے رک جاؤ':
              fontfile=/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf:
              fontcolor=white:
              fontsize=65:
              x=(w-text_w)/2:
              y=h-180:
              box=1:
              boxcolor=black@0.65:
              boxborderw=15[outv]
            " \
            -map "[outv]" \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -profile:v high \
            -pix_fmt yuv420p \
            -b:v 6800k \
            -maxrate 6800k \
            -bufsize 13600k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
