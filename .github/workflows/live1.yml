```yaml
name: Google Drive to YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # 1. Install FFmpeg and Wget
      - name: Install FFmpeg and Wget
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget

      # 2. Download Google Drive Video
      - name: Download Google Drive Video
        run: |
          wget --no-check-certificate \
            "https://drive.google.com/uc?export=download&id=1ZPrDCgbNEVwSh1gbjtP7bKjuyU2kksg9" \
            -O video.mp4

      # 3. Check Video
      - name: Check Video
        run: |
          ls -lh video.mp4
          file video.mp4
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            video.mp4

      # 4. Stream to YouTube
      - name: Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY secret is missing."
            exit 1
          fi

          ffmpeg \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -profile:v high \
            -level 4.2 \
            -b:v 6000k \
            -maxrate 6000k \
            -bufsize 12000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"
```
