      - name: Start YouTube Vertical Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY1 }}

        run: |
          ffmpeg \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -loop 1 \
            -i subscribe.png \
            -filter_complex "
              [0:v]scale=1080:1920:force_original_aspect_ratio=decrease,
              pad=1080:1920:(ow-iw)/2:(oh-ih)/2[video];

              [1:v]scale=650:-1[subscribe];

              [video][subscribe]overlay=(W-w)/2:80:shortest=1[withsub];

              [withsub]drawtext=text='یہ میرا نیا چینل ہے':
              fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf:
              fontcolor=red:
              fontsize=110:
              x=(w-text_w)/4:
              y=h-220:
              box=1:
              boxcolor=white@0.95:
              boxborderw=25[outv]
            " \
            -map "[outv]" \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -profile:v high \
            -pix_fmt yuv420p \
            -b:v 6800k \
            -maxrate 6800k \
            -bufsize 13600k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -flvflags no_duration_filesize \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
