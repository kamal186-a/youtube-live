name: Google Drive 16 Videos to YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Install FFmpeg and Gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install gdown

      - name: Download Google Drive Videos
        run: |
          mkdir -p videos

          gdown --folder \
            "https://drive.google.com/drive/folders/1htbSr_XtI4XTTV_Cpq8Wypitv000SuTP?usp=sharing" \
            -O videos \
            --remaining-ok

          echo "Downloaded files:"
          ls -lh videos

      - name: Create Playlist
        run: |
          rm -f playlist.txt

          for i in $(seq 1 16); do
            echo "file 'videos/Video $i.mp4'" >> playlist.txt
          done

          echo "Playlist:"
          cat playlist.txt

      - name: Check Videos
        run: |
          ls -lh videos/

          for i in $(seq 1 16); do
            test -f "videos/Video $i.mp4" || {
              echo "ERROR: Video $i.mp4 not found!"
              exit 1
            }
          done

          echo "All 16 videos found successfully."

      - name: Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |
          test -n "$STREAM_KEY" || {
            echo "ERROR: YOUTUBE_STREAM_KEY is missing"
            exit 1
          }

          ffmpeg \
            -re \
            -stream_loop -1 \
            -f concat \
            -safe 0 \
            -i playlist.txt \
            -vf 'scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2' \
            -c:v libx264 \
            -preset veryfast \
            -b:v 6000k \
            -maxrate 6000k \
            -bufsize 12000k \
            -pix_fmt yuv420p \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
