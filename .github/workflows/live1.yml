name: Google Drive 16 Videos to YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # 1. Install FFmpeg and Gdown
      - name: Install FFmpeg and Gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U gdown

      # 2. Download videos from Google Drive
      - name: Download Google Drive Videos
        run: |
          mkdir -p videos

          gdown --folder \
            "https://drive.google.com/drive/folders/1htbSr_XtI4XTTV_Cpq8Wypitv000SuTP?usp=sharing" \
            -O videos

          echo "Downloaded files:"
          ls -lh videos

      # 3. Check all 16 videos
      - name: Check Videos
        run: |
          for i in $(seq 1 16); do
            if [ ! -f "videos/Video $i.mp4" ]; then
              echo "ERROR: Video $i.mp4 not found!"
              exit 1
            fi
          done

          echo "All 16 videos found."

      # 4. Create playlist
      - name: Create Playlist
        run: |
          rm -f playlist.txt

          for i in $(seq 1 16); do
            echo "file 'videos/Video $i.mp4'" >> playlist.txt
          done

          cat playlist.txt

      # 5. Combine all 16 videos into one video
      - name: Combine Videos
        run: |
          ffmpeg \
            -f concat \
            -safe 0 \
            -i playlist.txt \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 6000k \
            -maxrate 6000k \
            -bufsize 12000k \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -avoid_negative_ts make_zero \
            combined.mp4

          ls -lh combined.mp4

      # 6. Stream combined video to YouTube
      - name: Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |
          test -n "$STREAM_KEY" || {
            echo "ERROR: YOUTUBE_STREAM_KEY is missing"
            exit 1
          }

          ffmpeg \
            -re \
            -stream_loop -1 \
            -i combined.mp4 \
            -c:v copy \
            -c:a copy \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
